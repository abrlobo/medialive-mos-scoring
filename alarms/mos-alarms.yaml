# CloudWatch alarms for MediaLive MOS scores.
#
# Warning alarms require three consecutive breaching periods; critical alarms
# require two. A single 60-second dip during a scene change or ad insertion is
# not worth a page, but three minutes of degraded audio during a live event is.
#
# Audio warns at 3.6 rather than 3.5 (the video warning threshold) so it fires
# while the score is still Fair, giving a margin before the Poor band. Both
# critical alarms sit at 3.0, the Poor/Bad boundary.
#
# TreatMissingData is notBreaching so an idle channel between events does not
# alarm.
#
# Set OutputFrameRate to your channel's output frame rate. It is the
# DroppedFrames denominator in MOS-Video; leaving it at 30 on a 60 fps channel
# understates the frame-drop rate by half.
#
# The MOS-Video alarms reference 10 metrics, which is the hard CloudWatch limit
# for a metric-math alarm, so the component expressions here are condensed
# relative to ../metric-math/mos-video.txt (intermediate normalisations are
# inlined). The arithmetic is identical - see ../reference/verify.py.
#
# The Mqcs* metrics require a CMAF Ingest output group delivering to
# MediaPackage. Without one they report no datapoints, the ISPRESENT guards
# fall back to best-case, and MOS-Video still scores from DroppedFrames,
# FillMsec and SvqTime alone. Treat such scores as a floor on impairment.

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Perceptual quality alarms (MOS-Audio, MOS-Video) for an AWS Elemental
  MediaLive channel, computed with CloudWatch Metric Math over native metrics.

Parameters:
  ChannelId:
    Type: String
    Description: MediaLive channel ID
  Pipeline:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
    Description: Pipeline to monitor
  AlarmTopicArn:
    Type: String
    Description: SNS topic ARN for alarm notifications
  OutputFrameRate:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >
      Channel output frame rate, used as the DroppedFrames denominator in
      MOS-Video. Set this to match your channel (25, 30, 50, 60). Leaving it
      at 30 on a 60 fps channel understates the frame-drop rate by half.

Resources:

  # ---------------------------------------------------------------- audio
  MosAudioWarning:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MOS_Audio_Warning-${ChannelId}-p${Pipeline}'
      AlarmDescription: >
        MediaLive audio MOS below Fair - investigate input health and loudness.
      ComparisonOperator: LessThanThreshold
      Threshold: 3.6
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Metrics:
        - Id: mos_a
          Label: MOS-Audio
          ReturnData: true
          Expression: >-
            MAX(1, MIN(4.5, 1 + 0.035*r + r*(r-60)*(100-r)*7e-6))
        - Id: r
          Label: R-factor
          ReturnData: false
          Expression: 'MAX(0, MIN(100, 93.2 - ie - fp - adp - scp))'
        - Id: ie
          Label: Equipment impairment
          ReturnData: false
          Expression: 'IF(plr == 0, 0, (30 * plr) / (plr + 10))'
        - Id: plr
          Label: Packet loss rate
          ReturnData: false
          Expression: 'IF(m1+m2 > 0, m1/(m1+m2)*100, 0)'
        - Id: fp
          Label: Fill penalty
          ReturnData: false
          Expression: 'MIN(m9/60000, 1) * 20'
        - Id: adp
          Label: Audio deviation penalty
          ReturnData: false
          Expression: 'MIN(ABS(m7 - (-23)) / 6, 1) * 10'
        - Id: scp
          Label: Silence/clip penalty
          ReturnData: false
          Expression: 'IF(m5 <= -60, 5, 0) + IF(m6 >= -1, 5, 0)'
        - Id: m1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsLost
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsReceived
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m5
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m6
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m7
          ReturnData: false
          MetricStat:
            Stat: Average
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelLkfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m9
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: FillMsec
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline

  MosAudioCritical:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MOS_Audio_Critical-${ChannelId}-p${Pipeline}'
      AlarmDescription: >
        MediaLive audio MOS Poor/Bad - listener impact likely, check RTP loss
        and FillMsec.
      ComparisonOperator: LessThanThreshold
      Threshold: 3.0
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Metrics:
        - Id: mos_a
          Label: MOS-Audio
          ReturnData: true
          Expression: >-
            MAX(1, MIN(4.5, 1 + 0.035*r + r*(r-60)*(100-r)*7e-6))
        - Id: r
          ReturnData: false
          Expression: 'MAX(0, MIN(100, 93.2 - ie - fp - adp - scp))'
        - Id: ie
          ReturnData: false
          Expression: 'IF(plr == 0, 0, (30 * plr) / (plr + 10))'
        - Id: plr
          ReturnData: false
          Expression: 'IF(m1+m2 > 0, m1/(m1+m2)*100, 0)'
        - Id: fp
          ReturnData: false
          Expression: 'MIN(m9/60000, 1) * 20'
        - Id: adp
          ReturnData: false
          Expression: 'MIN(ABS(m7 - (-23)) / 6, 1) * 10'
        - Id: scp
          ReturnData: false
          Expression: 'IF(m5 <= -60, 5, 0) + IF(m6 >= -1, 5, 0)'
        - Id: m1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsLost
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsReceived
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m5
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m6
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m7
          ReturnData: false
          MetricStat:
            Stat: Average
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelLkfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m9
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: FillMsec
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline

  # ---------------------------------------------------------------- video
  MosVideoWarning:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MOS_Video_Warning-${ChannelId}-p${Pipeline}'
      AlarmDescription: >
        MediaLive video MOS below Fair - check DroppedFrames and SvqTime.
      ComparisonOperator: LessThanThreshold
      Threshold: 3.5
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Metrics:
        - Id: mos_v
          Label: MOS-Video
          ReturnData: true
          Expression: 'MAX(1.0, MIN(4.5, 1.0 + POW(vqi, 0.9) * 3.5))'
        - Id: vqi
          Label: Video quality index
          ReturnData: false
          Expression: 'fds*0.35 + ffs*0.25 + eqs*0.20 + cis*0.15 + mns*0.05'
        - Id: fds
          Label: Frame drop score
          ReturnData: false
          Expression: !Sub
            - '1 - MIN(1, IF(m8 > 0, m8/(${FPS}*60), 0)*0.5
              + IF(ISPRESENT(m12), (100-m12)/100, 0)*0.5)'
            - FPS: !Ref OutputFrameRate
        - Id: ffs
          Label: Freeze frame score
          ReturnData: false
          Expression: >-
            IF(ISPRESENT(m13), m13/100, 1)*0.7 + (1 - MIN(1, m9/30000))*0.3
        - Id: eqs
          Label: Encoder quality score
          ReturnData: false
          Expression: >-
            (1 - MIN(1, m10/100))*0.5 + IF(ISPRESENT(m14), m14/100, 1)*0.5
        - Id: cis
          Label: Content integrity score
          ReturnData: false
          Expression: >-
            IF(ISPRESENT(m15), m15/100, 1)*0.35
            + IF(ISPRESENT(m16), m16/100, 1)*0.35
            + IF(ISPRESENT(m17), m17/100, 1)*0.30
        - Id: mns
          Label: MQCS normalised score
          ReturnData: false
          Expression: 'IF(ISPRESENT(m11), m11/100, 1)'
        - Id: m8
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: DroppedFrames
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m9
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: FillMsec
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m10
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: SvqTime
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m11
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MinMQCS
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m12
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsVideoFrameDrops
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m13
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsFreezeFrameDetected
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m14
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsSvq
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m15
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsBlackFrameDetected
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m16
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsFillFrameInsertion
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m17
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsContinuityCounterErrors
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline

  MosVideoCritical:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MOS_Video_Critical-${ChannelId}-p${Pipeline}'
      AlarmDescription: >
        MediaLive video MOS Poor/Bad - viewer impact likely, escalate to
        input failover.
      ComparisonOperator: LessThanThreshold
      Threshold: 3.0
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Metrics:
        - Id: mos_v
          Label: MOS-Video
          ReturnData: true
          Expression: 'MAX(1.0, MIN(4.5, 1.0 + POW(vqi, 0.9) * 3.5))'
        - Id: vqi
          ReturnData: false
          Expression: 'fds*0.35 + ffs*0.25 + eqs*0.20 + cis*0.15 + mns*0.05'
        - Id: fds
          ReturnData: false
          Expression: !Sub
            - '1 - MIN(1, IF(m8 > 0, m8/(${FPS}*60), 0)*0.5
              + IF(ISPRESENT(m12), (100-m12)/100, 0)*0.5)'
            - FPS: !Ref OutputFrameRate
        - Id: ffs
          ReturnData: false
          Expression: >-
            IF(ISPRESENT(m13), m13/100, 1)*0.7 + (1 - MIN(1, m9/30000))*0.3
        - Id: eqs
          ReturnData: false
          Expression: >-
            (1 - MIN(1, m10/100))*0.5 + IF(ISPRESENT(m14), m14/100, 1)*0.5
        - Id: cis
          ReturnData: false
          Expression: >-
            IF(ISPRESENT(m15), m15/100, 1)*0.35
            + IF(ISPRESENT(m16), m16/100, 1)*0.35
            + IF(ISPRESENT(m17), m17/100, 1)*0.30
        - Id: mns
          ReturnData: false
          Expression: 'IF(ISPRESENT(m11), m11/100, 1)'
        - Id: m8
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: DroppedFrames
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m9
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: FillMsec
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m10
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: SvqTime
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m11
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MinMQCS
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m12
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsVideoFrameDrops
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m13
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsFreezeFrameDetected
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m14
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsSvq
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m15
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsBlackFrameDetected
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m16
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsFillFrameInsertion
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m17
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: MqcsContinuityCounterErrors
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline

Outputs:
  AudioWarningAlarm:
    Description: Audio MOS warning alarm name (fires below 3.6)
    Value: !Ref MosAudioWarning
  AudioCriticalAlarm:
    Description: Audio MOS critical alarm name (fires below 3.0)
    Value: !Ref MosAudioCritical
  VideoWarningAlarm:
    Description: Video MOS warning alarm name (fires below 3.5)
    Value: !Ref MosVideoWarning
  VideoCriticalAlarm:
    Description: Video MOS critical alarm name (fires below 3.0)
    Value: !Ref MosVideoCritical
  FrameRateInUse:
    Description: >
      Frame rate used as the DroppedFrames denominator in MOS-Video. Confirm
      this matches the channel's output frame rate.
    Value: !Ref OutputFrameRate
