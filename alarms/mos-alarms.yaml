# CloudWatch alarms for MediaLive MOS scores.
#
# Warning alarms require three consecutive breaching periods; critical alarms
# require two. A single 60-second dip during a scene change or ad insertion is
# not worth a page, but three minutes of degraded audio during a live event is.
#
# TreatMissingData is notBreaching so an idle channel between events does not
# alarm.
#
# Replace <CHANNEL_ID>, <PIPELINE>, and <SNS_TOPIC_ARN> before deploying.

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Perceptual quality alarms (MOS-Audio, MOS-Video) for an AWS Elemental
  MediaLive channel, computed with CloudWatch Metric Math over native metrics.

Parameters:
  ChannelId:
    Type: String
    Description: MediaLive channel ID
  Pipeline:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
    Description: Pipeline to monitor
  AlarmTopicArn:
    Type: String
    Description: SNS topic ARN for alarm notifications
  OutputFrameRate:
    Type: Number
    Default: 30
    Description: >
      Channel output frame rate. Used as the DroppedFrames denominator in
      MOS-Video. Setting this wrong misreports the frame-continuity component.

Resources:

  # ---------------------------------------------------------------- audio
  MosAudioWarning:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MOS_Audio_Warning-${ChannelId}-p${Pipeline}'
      AlarmDescription: >
        MediaLive audio MOS below Fair - investigate input health and loudness.
      ComparisonOperator: LessThanThreshold
      Threshold: 3.6
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Metrics:
        - Id: mos_a
          Label: MOS-Audio
          ReturnData: true
          Expression: >-
            MAX(1, MIN(4.5, 1 + 0.035*r + r*(r-60)*(100-r)*7e-6))
        - Id: r
          Label: R-factor
          ReturnData: false
          Expression: 'MAX(0, MIN(100, 93.2 - ie - fp - adp - scp))'
        - Id: ie
          Label: Equipment impairment
          ReturnData: false
          Expression: 'IF(plr == 0, 0, (30 * plr) / (plr + 10))'
        - Id: plr
          Label: Packet loss rate
          ReturnData: false
          Expression: 'IF(m1+m2 > 0, m1/(m1+m2)*100, 0)'
        - Id: fp
          Label: Fill penalty
          ReturnData: false
          Expression: 'MIN(m9/60000, 1) * 20'
        - Id: adp
          Label: Audio deviation penalty
          ReturnData: false
          Expression: 'MIN(ABS(m7 - (-23)) / 6, 1) * 10'
        - Id: scp
          Label: Silence/clip penalty
          ReturnData: false
          Expression: 'IF(m5 <= -60, 5, 0) + IF(m6 >= -1, 5, 0)'
        - Id: m1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsLost
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsReceived
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m5
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m6
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m7
          ReturnData: false
          MetricStat:
            Stat: Average
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelLkfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m9
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: FillMsec
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline

  MosAudioCritical:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MOS_Audio_Critical-${ChannelId}-p${Pipeline}'
      AlarmDescription: >
        MediaLive audio MOS Poor/Bad - listener impact likely, check RTP loss
        and FillMsec.
      ComparisonOperator: LessThanThreshold
      Threshold: 3.0
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Metrics:
        - Id: mos_a
          Label: MOS-Audio
          ReturnData: true
          Expression: >-
            MAX(1, MIN(4.5, 1 + 0.035*r + r*(r-60)*(100-r)*7e-6))
        - Id: r
          ReturnData: false
          Expression: 'MAX(0, MIN(100, 93.2 - ie - fp - adp - scp))'
        - Id: ie
          ReturnData: false
          Expression: 'IF(plr == 0, 0, (30 * plr) / (plr + 10))'
        - Id: plr
          ReturnData: false
          Expression: 'IF(m1+m2 > 0, m1/(m1+m2)*100, 0)'
        - Id: fp
          ReturnData: false
          Expression: 'MIN(m9/60000, 1) * 20'
        - Id: adp
          ReturnData: false
          Expression: 'MIN(ABS(m7 - (-23)) / 6, 1) * 10'
        - Id: scp
          ReturnData: false
          Expression: 'IF(m5 <= -60, 5, 0) + IF(m6 >= -1, 5, 0)'
        - Id: m1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsLost
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: RtpPacketsReceived
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m5
          ReturnData: false
          MetricStat:
            Stat: Minimum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m6
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelDbfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m7
          ReturnData: false
          MetricStat:
            Stat: Average
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: OutputAudioLevelLkfs
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline
        - Id: m9
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/MediaLive
              MetricName: FillMsec
              Dimensions:
                - Name: ChannelId
                  Value: !Ref ChannelId
                - Name: Pipeline
                  Value: !Ref Pipeline

Outputs:
  AudioWarningAlarm:
    Description: Audio MOS warning alarm name
    Value: !Ref MosAudioWarning
  AudioCriticalAlarm:
    Description: Audio MOS critical alarm name
    Value: !Ref MosAudioCritical
  Note:
    Description: Video alarms
    Value: >
      MOS-Video alarms follow the same pattern with the expressions in
      ../metric-math/mos-video.txt. They are omitted here to keep this
      template readable; the Mqcs* metrics require a CMAF Ingest output
      group and ISPRESENT guards, which are easier to author in the console
      against a live channel.
